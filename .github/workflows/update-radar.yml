name: Update Dawnlit

on:
  push:
    branches: ["main"]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/update-radar.yml"
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Detroit"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dawnlit-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF text extractor
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Build daily recommendations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          CLOUDFLARE_FALLBACK_MODEL: ${{ vars.CLOUDFLARE_FALLBACK_MODEL }}
          RADAR_API_URL: ${{ vars.RADAR_API_URL }}
          RADAR_ADMIN_TOKEN: ${{ secrets.RADAR_ADMIN_TOKEN }}
          SEMANTIC_SCHOLAR_RECOMMENDATIONS: ${{ vars.SEMANTIC_SCHOLAR_RECOMMENDATIONS }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          AI_REQUIRED: "1"
        run: python scripts/build_radar.py

      - name: Commit updated feed
        run: |
          git config user.name "dawnlit-bot"
          git config user.email "dawnlit-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "chore: update paper radar"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
