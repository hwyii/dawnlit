<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A personal, explainable research radar for trustworthy large language models."
    />
    <meta name="theme-color" content="#f4f1e8" />
    <title>Dawnlit · Your Morning Research Signal</title>
    <link rel="stylesheet" href="./assets/styles.css?v=20260628c" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <header class="site-header">
      <a class="brand" href="./" aria-label="Dawnlit home">
        <span class="radar-mark" aria-hidden="true">
          <span></span>
        </span>
        <span>
          <strong>Dawnlit</strong>
          <small>your morning research signal</small>
        </span>
      </a>
      <div class="header-meta">
        <a class="install-link" href="./install.html">Install</a>
        <span id="modeBadge" class="mode-badge">LOCAL</span>
        <span id="lastUpdated">Loading…</span>
      </div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <nav id="mainNav">
          <button class="nav-item active" data-view="today">
            <span aria-hidden="true">⌁</span>
            Today
            <b id="todayCount">—</b>
          </button>
          <button class="nav-item" data-view="weekly">
            <span aria-hidden="true">◫</span>
            Weekly
            <b id="weeklyCount">—</b>
          </button>
          <button class="nav-item" data-view="saved">
            <span aria-hidden="true">◇</span>
            Saved
            <b id="savedCount">0</b>
          </button>
          <button class="nav-item" data-view="preferences">
            <span aria-hidden="true">⚙</span>
            Preferences
          </button>
        </nav>

        <section class="sidebar-section" aria-labelledby="focusTitle">
          <p id="focusTitle" class="eyebrow">CURRENT FOCUS</p>
          <div id="focusList" class="focus-list"></div>
        </section>

        <p class="sidebar-note">
          <span class="pulse-dot"></span>
          Curated daily, summarized on demand
        </p>
      </aside>

      <main id="main" tabindex="-1">
        <div id="loadingState" class="loading-state">
          <span class="loader"></span>
          <p>Calibrating your research radar…</p>
        </div>
        <div id="errorState" class="error-state hidden" role="alert"></div>
        <div id="appContent" class="hidden"></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="profileImport" type="file" accept="application/json" hidden />

    <script src="./runtime-config.js?v=20260628"></script>
    <script src="./assets/app.js?v=20260628c"></script>
  </body>
</html>
