<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dawnlit Widget Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 64px 24px;
        color: #1f2927;
        background:
          linear-gradient(rgba(31, 41, 39, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(31, 41, 39, 0.02) 1px, transparent 1px),
          #f4f1e8;
        background-size: 32px 32px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      main {
        max-width: 860px;
        margin: 0 auto;
      }

      .intro {
        margin-bottom: 24px;
      }

      .intro small {
        color: #1f6755;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      .intro h1 {
        margin: 5px 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(36px, 7vw, 58px);
        font-weight: 500;
        letter-spacing: -0.035em;
      }

      .intro p {
        color: #68736e;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="intro">
        <small>EMBEDDED COMPONENT</small>
        <h1>Inside any personal site.</h1>
        <p>The widget below is isolated from this page’s CSS and loads the same generated feed.</p>
      </div>

      <paper-radar-widget
        feed="./data/papers.json"
        limit="3"
        theme="light"
        heading="Recent papers"
        description="Selected around my current research interests."
        more-url="./"
      ></paper-radar-widget>
    </main>

    <script type="module" src="./widget/paper-radar-widget.js?v=20260628"></script>
  </body>
</html>
